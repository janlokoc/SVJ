# Uvolnění stagingu do produkce – tlačítko souhlasu provozovatele.
#
# Spouští se jen ručně: GitHub → Actions → „Uvolnit staging do produkce“ → Run workflow (jde i z mobilní aplikace GitHub).
# Kliknutí je souhlas s nasazením do produkce. Akce:
#   1. ověří, že poslední verze stagingu (větev claude/svj-web-redesign-admin-1m52yt) prošla testy i nasazením na staging,
#   2. posune větev main (produkce) na tutéž verzi – jen dopředu, nikdy nepřepíše cizí změny v main,
#   3. spustí „Nasazení na hosting“ pro main (testy → produkce) a do souhrnu běhu vypíše, co se uvolnilo.
# Nic jiného do produkce neposílá; push do main bez tohoto tlačítka se nedělá.
name: Uvolnit staging do produkce

on:
  workflow_dispatch:
    inputs:
      poznamka:
        description: 'Poznámka k uvolnění (nepovinné)'
        required: false
        default: ''

concurrency:
  group: uvolneni
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  STAGING: claude/svj-web-redesign-admin-1m52yt

jobs:
  uvolnit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stažení zdrojového kódu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Staging prošel testy i nasazením?
        id: kontrola
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin "$STAGING" main
          SHA=$(git rev-parse "origin/$STAGING")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/nasazeni.yml/runs?head_sha=$SHA&per_page=20" \
            --jq "[.workflow_runs[] | select(.head_branch == \"$STAGING\")][0] | \"\(.status) \(.conclusion)\"")
          echo "Poslední nasazení stagingu pro $SHA: ${RUN:-žádné}"
          if [ "$RUN" != "completed success" ]; then
            echo "::error::Staging ($SHA) ještě neprošel testy a nasazením (stav: ${RUN:-nespuštěno}). Počkejte na zelené nasazení stagingu a zkuste to znovu."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main "$SHA"; then
            echo "::error::Větev main obsahuje změny, které na stagingu nejsou – uvolnění by je přepsalo. Je potřeba je nejdřív sloučit do stagingu."
            exit 1
          fi
          if [ "$(git rev-parse origin/main)" = "$SHA" ]; then
            echo "Produkce už je na stejné verzi jako staging – není co uvolnit."
            echo "nic=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Co se uvolní
        if: steps.kontrola.outputs.nic != '1'
        env:
          POZNAMKA: ${{ inputs.poznamka }}
        run: |
          {
            echo "## Uvolnění do produkce"
            echo
            echo "Spustil: ${{ github.actor }}. ${POZNAMKA:+Poznámka: $POZNAMKA}"
            echo
            echo "Verze: \`${{ steps.kontrola.outputs.sha }}\`"
            echo
            echo "### Změny oproti produkci"
            git log --no-merges --format='- %s' "origin/main..${{ steps.kontrola.outputs.sha }}" | head -100
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Posunout main na verzi ze stagingu
        if: steps.kontrola.outputs.nic != '1'
        run: git push origin "${{ steps.kontrola.outputs.sha }}:refs/heads/main"

      - name: Spustit nasazení do produkce
        if: steps.kontrola.outputs.nic != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        # Push tokenem GITHUB_TOKEN sám nasazení nespustí – proto se spouští ručně (workflow_dispatch je povolený).
        run: gh workflow run nasazeni.yml --ref main
